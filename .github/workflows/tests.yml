name: run all programs
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Prolog and Lisp (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y swi-prolog-nox sbcl
      - name: Install the Python libraries
        run: pip install -r requirements.txt
      - name: Run every program
        run: python tests/run_all.py
